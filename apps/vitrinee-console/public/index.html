<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comprador x402 · compra agéntica</title>
<link rel="icon" href="/brand/agentpey-mark.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/brand/agentpey.css" />
<style>
  /* Layout of the console's own content only; colors, fonts and radii come from /brand/agentpey.css (T207, Y-7). */
  button { font: inherit; cursor: pointer; }
  .vt-brand-by { font-family: var(--ap-text); font-weight: 400; font-size: 0.8125rem; color: var(--ap-ink-2); letter-spacing: -0.005em; }
  .vt-head { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 8px; }
  .ap-header .ap-wrap.vt-head { max-width: none; }
  .meta { margin-left: auto; display: flex; gap: 6px 20px; flex-wrap: wrap; }
  .meta div { font-size: 0.75rem; color: var(--ap-ink-2); font-weight: 600; }
  .meta b { display: block; font-size: 0.8125rem; color: var(--ap-ink); font-weight: 500; font-family: var(--ap-mono); letter-spacing: 0; }
  main.vt-console { display: grid; grid-template-columns: minmax(420px, 1.25fr) minmax(400px, 1fr); gap: 28px; max-width: 1280px; margin: 0 auto; padding: 32px var(--ap-gutter-r) 64px var(--ap-gutter); }
  @media (max-width: 1000px) { main.vt-console { grid-template-columns: minmax(0, 1fr); } }
  main.vt-console section { min-width: 0; }
  main.vt-console h2 { font-size: 1.25rem; letter-spacing: -0.012em; margin: 0 0 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  main.vt-console h2 em { font-style: normal; font-family: var(--ap-text); font-weight: 400; font-size: 0.8125rem; color: var(--ap-ink-2); letter-spacing: 0; }
  main.vt-console h2 #refresh { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 16px; }
  .card { background: var(--ap-surface); border-radius: var(--ap-radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: filter .12s ease; }
  .card:hover { filter: brightness(0.98); }
  .card[aria-selected="true"] { outline: 2px solid var(--ap-accent); outline-offset: 0; }
  .card.sold { opacity: .45; cursor: not-allowed; }
  .thumb { aspect-ratio: 4/3; background: var(--ap-surface-2) center/cover no-repeat; display: grid; place-items: center; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .initial { width: 100%; height: 100%; display: grid; place-items: center; font: 600 2.5rem var(--ap-display); color: var(--ap-ink-2); background: var(--ap-surface-2); }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card .name { font-weight: 600; font-size: 0.9375rem; line-height: 1.3; }
  .card .usdc { font-family: var(--ap-mono); font-size: 0.9375rem; color: var(--ap-ink); font-weight: 600; letter-spacing: 0; }
  .card .clp, .card .stock { font-size: 0.75rem; color: var(--ap-ink-2); font-family: var(--ap-mono); letter-spacing: 0; }
  .panel { margin-bottom: 16px; }
  label { display: block; font-size: 0.8125rem; color: var(--ap-ink); margin: 0 0 6px; font-weight: 600; }
  .ap input[type=text], .ap input[type=number] { font-family: var(--ap-mono); font-size: 0.875rem; letter-spacing: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .row.three { grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 560px) { .row, .row.three { grid-template-columns: minmax(0, 1fr); } }
  .buy.ap-btn { width: 100%; margin-top: 4px; }
  .buy.busy { background: var(--ap-warn-soft); color: var(--ap-warn); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--ap-ink-2); font-weight: 400; margin-top: 12px; }
  .toggle input { accent-color: var(--ap-accent); }
  #log {
    background: var(--ap-surface); border-radius: var(--ap-radius); padding: 16px 18px;
    font: 0.75rem/1.65 var(--ap-mono); letter-spacing: 0; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow-y: auto; color: var(--ap-ink-2); margin-bottom: 16px;
  }
  #log:empty { display: none; }
  #log .in { color: var(--ap-link); }
  #log .out { color: var(--ap-ok); }
  #log .err { color: var(--ap-bad); }
  .proof dl { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px 16px; margin: 0 0 16px; }
  .proof dt { font-size: 0.8125rem; color: var(--ap-ink-2); font-weight: 600; padding-top: 1px; }
  .proof dd { margin: 0; font-family: var(--ap-mono); font-size: 0.8125rem; letter-spacing: 0; word-break: break-all; }
  @media (max-width: 560px) { .proof dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .proof dd { margin-bottom: 8px; } }
  .checks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .check { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 0.875rem; }
  .check b { font-weight: 600; min-width: 74px; }
  .check span { color: var(--ap-ink-2); font-family: var(--ap-mono); font-size: 0.75rem; letter-spacing: 0; overflow-wrap: anywhere; }
  .verdict { font-weight: 600; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--ap-ink-2); font-size: 0.875rem; padding: 30px 0; text-align: center; }
  .error { margin-bottom: 16px; }
</style>
</head>
<body class="ap">
<header class="ap-header">
  <div class="ap-wrap vt-head">
    <span class="ap-brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><defs><mask id="ap-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><path d="M378 112l54 54" stroke="#000" stroke-width="60"/></mask></defs><g mask="url(#ap-cut)" fill="none" stroke="currentColor" stroke-width="60"><path d="M72 416 196 96h86v320"/><path d="M136 282h146"/><path d="M282 112h96"/><path d="M432 166v84l-48 48H282"/></g></svg>
      Comprador x402 <span class="vt-brand-by">· cliente de demostración</span>
    </span>
    <span class="ap-pill ap-info" id="network">stellar:testnet</span>
    <div class="meta">
      <div>Tienda<b id="merchant">…</b></div>
      <div>Pagador<b id="payer">…</b></div>
      <div>Tope<b id="cap">…</b></div>
    </div>
  </div>
</header>

<main class="vt-console">
  <section id="left">
    <h2>Bazaar en vivo <em id="count"></em>
      <button class="ap-btn ap-btn-secondary ap-btn-sm" id="refresh">Recargar</button>
    </h2>
    <div class="grid" id="catalog"><div class="empty">Leyendo /discovery/resources…</div></div>
  </section>

  <section id="right">
    <h2>Pedido</h2>
    <div class="ap-card panel">
      <div id="selection" class="empty" style="padding:8px 0">Elige un producto del bazaar.</div>
      <div id="form" hidden>
        <div class="row three">
          <div><label for="qty">Cant.</label><input type="number" id="qty" min="1" max="100" value="1" /></div>
          <div><label for="name">Nombre</label><input type="text" id="name" value="Agente comprador" /></div>
          <div><label for="city">Comuna / ciudad</label><input type="text" id="city" value="Ñuñoa" /></div>
        </div>
        <div class="row">
          <div><label for="address">Dirección</label><input type="text" id="address" value="Av. Irarrázaval 1234" /></div>
          <div><label for="maxusdc">Tope por pago (USDC)</label><input type="text" id="maxusdc" value="100" /></div>
        </div>
        <button class="ap-btn buy" id="go">Pagar con x402</button>
        <label class="toggle"><input type="checkbox" id="dry" /> Dry run — llegar al 402 y no pagar</label>
      </div>
    </div>

    <div id="error"></div>
    <div id="log"></div>
    <div id="proof"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtCLP = (v) => Number(v).toLocaleString("es-CL");
const short = (s) => s ? `${s.slice(0, 4)}…${s.slice(-4)}` : "—";
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let session = null, products = [], selected = null, lastReceipt = null;

async function loadSession() {
  session = await (await fetch("/api/session")).json();
  $("payer").textContent = session.canPay ? short(session.payerAccount) : "sin llave";
  $("payer").title = session.payerAccount ?? "";
  $("cap").textContent = `${session.maxUsdc} USDC`;
  $("maxusdc").value = session.maxUsdc;
  $("network").textContent = session.network;
  if (!session.canPay) $("dry").checked = true;
}

async function loadBazaar() {
  $("catalog").innerHTML = '<div class="empty">Leyendo /discovery/resources…</div>';
  const response = await fetch("/api/bazaar");
  const data = await response.json();
  if (!response.ok) {
    $("catalog").innerHTML = `<div class="ap-note ap-bad error">${esc(data.message ?? "el gateway no respondió")}</div>`;
    return;
  }
  products = data.products;
  $("merchant").textContent = data.merchant.name;
  $("merchant").title = data.merchant.did;
  $("count").textContent = `· ${data.bazaarTotal} recursos pagables · ${data.fx.rate} ${data.fx.quote}/${data.fx.base}`;
  $("catalog").innerHTML = products.map(renderCard).join("");
  for (const el of document.querySelectorAll(".card:not(.sold)")) {
    el.onclick = () => select(el.dataset.id);
  }
  for (const img of document.querySelectorAll(".thumb img")) {
    const fallback = () => {
      const tile = document.createElement("div");
      tile.className = "initial";
      tile.textContent = img.dataset.initial ?? "\u00b7";
      img.replaceWith(tile);
    };
    // A URL that 404s fires error; one that resolves to nothing loads at 0x0.
    img.addEventListener("error", fallback, { once: true });
    if (img.complete && img.naturalWidth === 0) fallback();
  }
  if (selected !== null && !products.some((p) => p.id === selected.id)) select(null);
}

/** A store with no photo uploaded still needs a tile that looks deliberate. */
function initialOf(p) {
  return (p.name ?? "").trim()[0] ?? "\u00b7";
}

function renderCard(p) {
  const sold = !p.purchasable;
  const image = p.images?.[0];
  return `<article class="card${sold ? " sold" : ""}" data-id="${esc(p.id)}" aria-selected="${selected?.id === p.id}">
    <div class="thumb">${image
      ? `<img src="${esc(image)}" alt="" loading="lazy" data-initial="${esc(initialOf(p))}" />`
      : `<div class="initial">${esc(initialOf(p))}</div>`}</div>
    <div class="body">
      <div class="name">${esc(p.name)}</div>
      <div class="usdc">${p.priceUSDC} USDC</div>
      <div class="clp">${fmtCLP(p.priceLocal)} ${p.currency}</div>
      <div class="stock">${sold ? "agotado" : p.stock === null ? "sin control de stock" : `${p.stock} en stock`}</div>
    </div>
  </article>`;
}

function select(id) {
  selected = products.find((p) => p.id === id) ?? null;
  for (const el of document.querySelectorAll(".card")) el.setAttribute("aria-selected", String(el.dataset.id === id));
  $("form").hidden = selected === null;
  if (selected === null) { $("selection").hidden = false; return; }
  $("selection").hidden = true;
  updateTotal();
}

function updateTotal() {
  if (selected === null) return;
  const qty = Math.max(1, Number($("qty").value) || 1);
  const total = (Number(selected.priceUSDC) * qty).toFixed(7).replace(/0+$/, "").replace(/\.$/, "");
  const accepts = selected.offer?.accepts?.[0];
  $("go").textContent = $("dry").checked
    ? `Pedir el 402 de ${total} USDC`
    : `Pagar ${total} USDC por ${selected.name}`;
  $("go").title = accepts ? `${accepts.scheme} · ${accepts.network} · payTo ${accepts.payTo}` : "";
}

$("qty").oninput = updateTotal;
$("dry").onchange = updateTotal;
$("refresh").onclick = loadBazaar;

function logLine(line) {
  const cls = line.startsWith("→") ? "in" : line.startsWith("←") ? "out" : line.includes("❌") ? "err" : "";
  $("log").insertAdjacentHTML("beforeend", `<div class="${cls}">${esc(line)}</div>`);
  $("log").scrollTop = $("log").scrollHeight;
}

$("go").onclick = async () => {
  if (selected === null) return;
  $("error").innerHTML = ""; $("proof").innerHTML = ""; $("log").innerHTML = "";
  $("go").disabled = true; $("go").classList.add("busy");
  const label = $("go").textContent;
  $("go").textContent = "En vuelo…";

  const body = {
    productId: selected.id,
    quantity: Math.max(1, Number($("qty").value) || 1),
    shipping: { name: $("name").value, address: $("address").value, city: $("city").value, country: "CL" },
    maxUsdc: $("maxusdc").value.trim() || session.maxUsdc,
    dryRun: $("dry").checked,
  };

  try {
    const response = await fetch("/api/buy", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop() ?? "";
      for (const frame of frames) {
        const event = /^event: (.+)$/m.exec(frame)?.[1];
        const data = JSON.parse(/^data: (.+)$/m.exec(frame)?.[1] ?? "{}");
        if (event === "log") logLine(data.line);
        else if (event === "done") renderProof(data);
        else if (event === "failed") {
          $("error").innerHTML = `<div class="ap-note ap-bad error"><b>${esc(data.code)}</b> — ${esc(data.message)}</div>`;
        }
      }
    }
  } catch (error) {
    $("error").innerHTML = `<div class="ap-note ap-bad error">${esc(error.message)}</div>`;
  } finally {
    $("go").disabled = false; $("go").classList.remove("busy"); $("go").textContent = label;
    loadBazaar();
  }
};

function renderProof(data) {
  if (data.dryRun || data.order === null) {
    const accepts = data.requirements;
    $("proof").innerHTML = `<div class="ap-card panel proof">
      <div class="ap-note ap-ok verdict ok">402 recibido — la tienda cotizó el pago y nadie pagó</div>
      <dl>
        <dt>Cobro</dt><dd>${esc(accepts.amount)} stroops USDC</dd>
        <dt>payTo</dt><dd>${esc(accepts.payTo)}</dd>
        <dt>Red</dt><dd>${esc(accepts.network)} · ${esc(accepts.scheme)}</dd>
      </dl></div>`;
    return;
  }
  const order = data.order;
  const verification = data.verification;
  lastReceipt = order.receiptJws;
  const anchor = order.anchor ?? {};
  $("proof").innerHTML = `<div class="ap-card panel proof">
    ${verification ? `<div class="ap-note verdict ${verification.valid ? "ap-ok ok" : "ap-bad bad"}">${verification.valid ? "✅ Recibo válido — las tres verificaciones pasan" : "❌ Recibo inválido"}</div>` : ""}
    <dl>
      <dt>Pedido</dt><dd>${esc(order.orderId)}</dd>
      <dt>${esc(order.platform)}</dt><dd>${esc(order.platformOrderId ?? "—")} · ${esc(order.status)}</dd>
      <dt>Pagado</dt><dd>${esc(order.amountUSDC)} USDC</dd>
      <dt>Transacción</dt><dd><a href="${esc(order.explorerUrl)}" target="_blank" rel="noreferrer">${esc(order.txHash)}</a></dd>
      <dt>Recibo</dt><dd>sha256 ${esc(order.receiptHash ?? "—")}</dd>
      <dt>Anclaje</dt><dd>${anchor.status === "anchored"
        ? `ledger ${anchor.ledger}${anchor.explorerUrl ? ` · <a href="${esc(anchor.explorerUrl)}" target="_blank" rel="noreferrer">receipt-registry</a>` : ""}`
        : esc(`${anchor.status ?? "?"}${anchor.lastError ? ` (${anchor.lastError})` : ""}`)}</dd>
      <dt>Tiempo</dt><dd>${(data.elapsedMs / 1000).toFixed(1)} s</dd>
    </dl>
    ${verification ? renderChecks(verification) : ""}
    <div class="actions">
      <button class="ap-btn ap-btn-secondary ap-btn-sm" id="reverify">Verificar de nuevo</button>
      <button class="ap-btn ap-btn-secondary ap-btn-sm" id="tamper">Adulterar el monto y verificar</button>
    </div>
  </div>`;
  $("reverify").onclick = () => verifyReceipt(false);
  $("tamper").onclick = () => verifyReceipt(true);
}

function renderChecks(v) {
  const { signature, anchored, settlement } = v.checks;
  const row = (ok, title, detail) =>
    `<div class="check">${ok ? "✅" : "❌"}<b>${title}</b><span>${esc(detail)}</span></div>`;
  return `<div class="checks">
    ${row(signature.ok, "Firma", signature.ok ? `Ed25519 de ${signature.signer ?? "?"}` : (signature.reason ?? "inválida"))}
    ${row(anchored.ok, "Anclaje", anchored.ok && anchored.record ? `receipt-registry · ledger ${anchored.record.ledger}` : (anchored.reason ?? "no anclado"))}
    ${row(settlement.ok, "Pago", settlement.ok ? `confirmado en Stellar · ledger ${settlement.ledger ?? "?"}` : (settlement.reason ?? "no confirmado"))}
  </div>`;
}

async function verifyReceipt(tamper) {
  if (lastReceipt === null) return;
  logLine(tamper ? "→ POST /receipts/verify (con el monto adulterado)" : "→ POST /receipts/verify");
  const result = await (await fetch("/api/verify", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ receiptJws: lastReceipt, tamper }),
  })).json();
  if (result.tampered) logLine(`  editado     amountUSDC ${result.tampered.from} → ${result.tampered.to}`);
  const { signature, anchored, settlement } = result.checks;
  logLine(`  ${signature.ok ? "✅" : "❌"} firma      ${signature.ok ? signature.signer : (signature.reason ?? "inválida")}`);
  logLine(`  ${anchored.ok ? "✅" : "❌"} anclaje    ${anchored.ok ? `ledger ${anchored.record?.ledger}` : (anchored.reason ?? "no anclado")}`);
  logLine(`  ${settlement.ok ? "✅" : "❌"} pago       ${settlement.ok ? `ledger ${settlement.ledger}` : (settlement.reason ?? "no confirmado")}`);
  logLine(result.valid ? "  ✅ RECIBO VÁLIDO" : "  ❌ RECIBO INVÁLIDO");
}

loadSession().then(loadBazaar);
</script>
</body>
</html>
