<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RealOps · compra agéntica</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --panel-2: #171d2b; --line: #232b3d;
    --ink: #e7ecf5; --dim: #8b97ad; --faint: #5d6880;
    --accent: #5b8cff; --ok: #2fd08b; --bad: #ff5f6d; --warn: #ffc457;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-size: 17px; font-weight: 650; letter-spacing: -0.2px; }
  .brand span { color: var(--faint); font-weight: 400; }
  .meta { margin-left: auto; display: flex; gap: 20px; flex-wrap: wrap; }
  .meta div { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; }
  .meta b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 550; text-transform: none; letter-spacing: 0; font-family: var(--mono); }
  .badge { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600;
           background: rgba(91,140,255,.14); color: var(--accent); border: 1px solid rgba(91,140,255,.3); }
  main { display: grid; grid-template-columns: minmax(420px, 1.25fr) minmax(400px, 1fr); gap: 0; min-height: calc(100vh - 59px); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  section { padding: 20px 22px; }
  #left { border-right: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .9px; color: var(--faint); margin: 0 0 14px; font-weight: 600; }
  h2 em { font-style: normal; color: var(--dim); text-transform: none; letter-spacing: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: border-color .12s, transform .12s; display: flex; flex-direction: column;
  }
  .card:hover { border-color: #33405c; transform: translateY(-1px); }
  .card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.sold { opacity: .45; cursor: not-allowed; }
  .thumb { aspect-ratio: 4/3; background: #0e1320 center/cover no-repeat; display: grid; place-items: center; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .initial {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 40px; font-weight: 700; color: rgba(231,236,245,.22);
    background: linear-gradient(135deg, #141b2b, #1d2537);
  }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card .name { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .card .usdc { font-family: var(--mono); font-size: 15px; color: var(--ok); font-weight: 600; }
  .card .clp, .card .stock { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 0 0 5px; font-weight: 600; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: 13px var(--mono);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .row.three { grid-template-columns: 90px 1fr 1fr; }
  .buy {
    width: 100%; padding: 13px; border-radius: 10px; border: 0; background: var(--accent); color: #fff;
    font-weight: 650; font-size: 14.5px; margin-top: 4px;
  }
  .buy:disabled { background: #2a3550; color: var(--faint); cursor: not-allowed; }
  .buy.busy { background: var(--warn); color: #221a00; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); padding: 7px 11px; border-radius: 8px; font-size: 12px; }
  .ghost:hover { border-color: var(--accent); color: var(--ink); }
  .toggle { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); margin-top: 10px; }
  #log {
    background: #080b11; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow-y: auto; color: #b9c4d8; margin-bottom: 14px;
  }
  #log:empty { display: none; }
  #log .in { color: var(--accent); }
  #log .out { color: var(--ok); }
  #log .err { color: var(--bad); }
  .proof dl { display: grid; grid-template-columns: 116px 1fr; gap: 7px 14px; margin: 0 0 14px; }
  .proof dt { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); font-weight: 600; padding-top: 2px; }
  .proof dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .checks { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .check { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; }
  .check b { font-weight: 600; min-width: 74px; }
  .check span { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }
  .verdict { padding: 10px 14px; border-radius: 9px; font-weight: 650; font-size: 13.5px; margin-bottom: 12px; }
  .verdict.ok { background: rgba(47,208,139,.12); color: var(--ok); border: 1px solid rgba(47,208,139,.3); }
  .verdict.bad { background: rgba(255,95,109,.12); color: var(--bad); border: 1px solid rgba(255,95,109,.3); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--faint); font-size: 13px; padding: 30px 0; text-align: center; }
  .error { background: rgba(255,95,109,.1); border: 1px solid rgba(255,95,109,.3); color: #ffa8ae;
           padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">RealOps <span>· plataforma compradora</span></div>
  <span class="badge" id="network">stellar:testnet</span>
  <div class="meta">
    <div>Tienda<b id="merchant">…</b></div>
    <div>Pagador<b id="payer">…</b></div>
    <div>Tope<b id="cap">…</b></div>
  </div>
</header>

<main>
  <section id="left">
    <h2>Bazaar en vivo <em id="count"></em>
      <button class="ghost" id="refresh" style="float:right;margin-top:-4px">Recargar</button>
    </h2>
    <div class="grid" id="catalog"><div class="empty">Leyendo /discovery/resources…</div></div>
  </section>

  <section id="right">
    <h2>Pedido</h2>
    <div class="panel">
      <div id="selection" class="empty" style="padding:8px 0">Elige un producto del bazaar.</div>
      <div id="form" hidden>
        <div class="row three">
          <div><label for="qty">Cant.</label><input type="number" id="qty" min="1" max="100" value="1" /></div>
          <div><label for="name">Nombre</label><input type="text" id="name" value="RealOps Agente" /></div>
          <div><label for="city">Comuna / ciudad</label><input type="text" id="city" value="Ñuñoa" /></div>
        </div>
        <div class="row">
          <div><label for="address">Dirección</label><input type="text" id="address" value="Av. Irarrázaval 1234" /></div>
          <div><label for="maxusdc">Tope por pago (USDC)</label><input type="text" id="maxusdc" value="100" /></div>
        </div>
        <button class="buy" id="go">Pagar con x402</button>
        <label class="toggle"><input type="checkbox" id="dry" /> Dry run — llegar al 402 y no pagar</label>
      </div>
    </div>

    <div id="error"></div>
    <div id="log"></div>
    <div id="proof"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtCLP = (v) => Number(v).toLocaleString("es-CL");
const short = (s) => s ? `${s.slice(0, 4)}…${s.slice(-4)}` : "—";
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let session = null, products = [], selected = null, lastReceipt = null;

async function loadSession() {
  session = await (await fetch("/api/session")).json();
  $("payer").textContent = session.canPay ? short(session.payerAccount) : "sin llave";
  $("payer").title = session.payerAccount ?? "";
  $("cap").textContent = `${session.maxUsdc} USDC`;
  $("maxusdc").value = session.maxUsdc;
  $("network").textContent = session.network;
  if (!session.canPay) $("dry").checked = true;
}

async function loadBazaar() {
  $("catalog").innerHTML = '<div class="empty">Leyendo /discovery/resources…</div>';
  const response = await fetch("/api/bazaar");
  const data = await response.json();
  if (!response.ok) {
    $("catalog").innerHTML = `<div class="error">${esc(data.message ?? "el gateway no respondió")}</div>`;
    return;
  }
  products = data.products;
  $("merchant").textContent = data.merchant.name;
  $("merchant").title = data.merchant.did;
  $("count").textContent = `· ${data.bazaarTotal} recursos pagables · ${data.fx.rate} ${data.fx.quote}/${data.fx.base}`;
  $("catalog").innerHTML = products.map(renderCard).join("");
  for (const el of document.querySelectorAll(".card:not(.sold)")) {
    el.onclick = () => select(el.dataset.id);
  }
  for (const img of document.querySelectorAll(".thumb img")) {
    const fallback = () => {
      const tile = document.createElement("div");
      tile.className = "initial";
      tile.textContent = img.dataset.initial ?? "\u00b7";
      img.replaceWith(tile);
    };
    // A URL that 404s fires error; one that resolves to nothing loads at 0x0.
    img.addEventListener("error", fallback, { once: true });
    if (img.complete && img.naturalWidth === 0) fallback();
  }
  if (selected !== null && !products.some((p) => p.id === selected.id)) select(null);
}

/** A store with no photo uploaded still needs a tile that looks deliberate. */
function initialOf(p) {
  return (p.name ?? "").trim()[0] ?? "\u00b7";
}

function renderCard(p) {
  const sold = !p.purchasable;
  const image = p.images?.[0];
  return `<article class="card${sold ? " sold" : ""}" data-id="${esc(p.id)}" aria-selected="${selected?.id === p.id}">
    <div class="thumb">${image
      ? `<img src="${esc(image)}" alt="" loading="lazy" data-initial="${esc(initialOf(p))}" />`
      : `<div class="initial">${esc(initialOf(p))}</div>`}</div>
    <div class="body">
      <div class="name">${esc(p.name)}</div>
      <div class="usdc">${p.priceUSDC} USDC</div>
      <div class="clp">${fmtCLP(p.priceLocal)} ${p.currency}</div>
      <div class="stock">${sold ? "agotado" : p.stock === null ? "sin control de stock" : `${p.stock} en stock`}</div>
    </div>
  </article>`;
}

function select(id) {
  selected = products.find((p) => p.id === id) ?? null;
  for (const el of document.querySelectorAll(".card")) el.setAttribute("aria-selected", String(el.dataset.id === id));
  $("form").hidden = selected === null;
  if (selected === null) { $("selection").hidden = false; return; }
  $("selection").hidden = true;
  updateTotal();
}

function updateTotal() {
  if (selected === null) return;
  const qty = Math.max(1, Number($("qty").value) || 1);
  const total = (Number(selected.priceUSDC) * qty).toFixed(7).replace(/0+$/, "").replace(/\.$/, "");
  const accepts = selected.offer?.accepts?.[0];
  $("go").textContent = $("dry").checked
    ? `Pedir el 402 de ${total} USDC`
    : `Pagar ${total} USDC por ${selected.name}`;
  $("go").title = accepts ? `${accepts.scheme} · ${accepts.network} · payTo ${accepts.payTo}` : "";
}

$("qty").oninput = updateTotal;
$("dry").onchange = updateTotal;
$("refresh").onclick = loadBazaar;

function logLine(line) {
  const cls = line.startsWith("→") ? "in" : line.startsWith("←") ? "out" : line.includes("❌") ? "err" : "";
  $("log").insertAdjacentHTML("beforeend", `<div class="${cls}">${esc(line)}</div>`);
  $("log").scrollTop = $("log").scrollHeight;
}

$("go").onclick = async () => {
  if (selected === null) return;
  $("error").innerHTML = ""; $("proof").innerHTML = ""; $("log").innerHTML = "";
  $("go").disabled = true; $("go").classList.add("busy");
  const label = $("go").textContent;
  $("go").textContent = "En vuelo…";

  const body = {
    productId: selected.id,
    quantity: Math.max(1, Number($("qty").value) || 1),
    shipping: { name: $("name").value, address: $("address").value, city: $("city").value, country: "CL" },
    maxUsdc: $("maxusdc").value.trim() || session.maxUsdc,
    dryRun: $("dry").checked,
  };

  try {
    const response = await fetch("/api/buy", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop() ?? "";
      for (const frame of frames) {
        const event = /^event: (.+)$/m.exec(frame)?.[1];
        const data = JSON.parse(/^data: (.+)$/m.exec(frame)?.[1] ?? "{}");
        if (event === "log") logLine(data.line);
        else if (event === "done") renderProof(data);
        else if (event === "failed") {
          $("error").innerHTML = `<div class="error"><b>${esc(data.code)}</b> — ${esc(data.message)}</div>`;
        }
      }
    }
  } catch (error) {
    $("error").innerHTML = `<div class="error">${esc(error.message)}</div>`;
  } finally {
    $("go").disabled = false; $("go").classList.remove("busy"); $("go").textContent = label;
    loadBazaar();
  }
};

function renderProof(data) {
  if (data.dryRun || data.order === null) {
    const accepts = data.requirements;
    $("proof").innerHTML = `<div class="panel proof">
      <div class="verdict ok">402 recibido — la tienda cotizó el pago y nadie pagó</div>
      <dl>
        <dt>Cobro</dt><dd>${esc(accepts.amount)} stroops USDC</dd>
        <dt>payTo</dt><dd>${esc(accepts.payTo)}</dd>
        <dt>Red</dt><dd>${esc(accepts.network)} · ${esc(accepts.scheme)}</dd>
      </dl></div>`;
    return;
  }
  const order = data.order;
  const verification = data.verification;
  lastReceipt = order.receiptJws;
  const anchor = order.anchor ?? {};
  $("proof").innerHTML = `<div class="panel proof">
    ${verification ? `<div class="verdict ${verification.valid ? "ok" : "bad"}">${verification.valid ? "✅ Recibo válido — las tres verificaciones pasan" : "❌ Recibo inválido"}</div>` : ""}
    <dl>
      <dt>Pedido</dt><dd>${esc(order.orderId)}</dd>
      <dt>${esc(order.platform)}</dt><dd>${esc(order.platformOrderId ?? "—")} · ${esc(order.status)}</dd>
      <dt>Pagado</dt><dd>${esc(order.amountUSDC)} USDC</dd>
      <dt>Transacción</dt><dd><a href="${esc(order.explorerUrl)}" target="_blank" rel="noreferrer">${esc(order.txHash)}</a></dd>
      <dt>Recibo</dt><dd>sha256 ${esc(order.receiptHash ?? "—")}</dd>
      <dt>Anclaje</dt><dd>${anchor.status === "anchored"
        ? `ledger ${anchor.ledger}${anchor.explorerUrl ? ` · <a href="${esc(anchor.explorerUrl)}" target="_blank" rel="noreferrer">receipt-registry</a>` : ""}`
        : esc(`${anchor.status ?? "?"}${anchor.lastError ? ` (${anchor.lastError})` : ""}`)}</dd>
      <dt>Tiempo</dt><dd>${(data.elapsedMs / 1000).toFixed(1)} s</dd>
    </dl>
    ${verification ? renderChecks(verification) : ""}
    <div class="actions">
      <button class="ghost" id="reverify">Verificar de nuevo</button>
      <button class="ghost" id="tamper">Adulterar el monto y verificar</button>
    </div>
  </div>`;
  $("reverify").onclick = () => verifyReceipt(false);
  $("tamper").onclick = () => verifyReceipt(true);
}

function renderChecks(v) {
  const { signature, anchored, settlement } = v.checks;
  const row = (ok, title, detail) =>
    `<div class="check">${ok ? "✅" : "❌"}<b>${title}</b><span>${esc(detail)}</span></div>`;
  return `<div class="checks">
    ${row(signature.ok, "Firma", signature.ok ? `Ed25519 de ${signature.signer ?? "?"}` : (signature.reason ?? "inválida"))}
    ${row(anchored.ok, "Anclaje", anchored.ok && anchored.record ? `receipt-registry · ledger ${anchored.record.ledger}` : (anchored.reason ?? "no anclado"))}
    ${row(settlement.ok, "Pago", settlement.ok ? `confirmado en Stellar · ledger ${settlement.ledger ?? "?"}` : (settlement.reason ?? "no confirmado"))}
  </div>`;
}

async function verifyReceipt(tamper) {
  if (lastReceipt === null) return;
  logLine(tamper ? "→ POST /receipts/verify (con el monto adulterado)" : "→ POST /receipts/verify");
  const result = await (await fetch("/api/verify", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ receiptJws: lastReceipt, tamper }),
  })).json();
  if (result.tampered) logLine(`  editado     amountUSDC ${result.tampered.from} → ${result.tampered.to}`);
  const { signature, anchored, settlement } = result.checks;
  logLine(`  ${signature.ok ? "✅" : "❌"} firma      ${signature.ok ? signature.signer : (signature.reason ?? "inválida")}`);
  logLine(`  ${anchored.ok ? "✅" : "❌"} anclaje    ${anchored.ok ? `ledger ${anchored.record?.ledger}` : (anchored.reason ?? "no anclado")}`);
  logLine(`  ${settlement.ok ? "✅" : "❌"} pago       ${settlement.ok ? `ledger ${settlement.ledger}` : (settlement.reason ?? "no confirmado")}`);
  logLine(result.valid ? "  ✅ RECIBO VÁLIDO" : "  ❌ RECIBO INVÁLIDO");
}

loadSession().then(loadBazaar);
</script>
</body>
</html>
