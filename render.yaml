# T86 — one Render service for the whole pilot. `agentpey.com`,
# `realops.agentpey.com` and `signaldesk.agentpey.com` all point here, and
# `apps/gateway` spawns `apps/web`, `apps/realops` and `apps/signaldesk` as
# three separate OS processes, forwarding each request by its `Host` header.
# Since T102, `vitrinee.agentpey.com` too: the Vitrinee store gateway is a
# fourth process (`C-134`), started only once its secrets are set (`C-136`).
#
# Before T86 these were three services (`agentpey-web`, `agentpey-realops`,
# `agentpey-signaldesk`), and keeping all three warm meant three Starter plans.
# What that separation bought is kept, not given up: SignalDesk is only credible
# as a merchant that cannot reach into AgentPey's authorisation if it holds
# none of AgentPey's keys (`C-88`). Render gives one service one set of
# variables, so every secret below lands in the gateway's environment — and
# `apps/gateway/src/hosts.ts` (`envKeys`) is the list of which ones each child
# is actually handed. A key added here and not there reaches no app.
services:
  - type: web
    # Matches the service's name in the dashboard, where it was created by hand
    # before this file described it.
    name: AgentPey
    runtime: node
    # Starter, not Free: a demo cannot open on a cold start, and one warm plan
    # for three apps is the point of this service.
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @agentpey/gateway run start
    # No healthCheckPath, on purpose. Render's check does not arrive with any of
    # the three hostnames below, and the gateway answers an unknown host with a
    # 404 rather than guessing an app — so a health check path would fail every
    # deploy while all three apps were fine.
    #
    # Every hostname here must also be in the gateway's host map
    # (`apps/gateway/src/server.ts`); one missing there is a 404, not a fallback.
    # `www.agentpey.com` is not listed: Render adds it with the apex and
    # redirects it to `agentpey.com`, so the gateway never sees it.
    domains:
      - agentpey.com
      - realops.agentpey.com
      # Must match the `baseUrl` of the `signaldesk` row in
      # apps/agent/src/catalog/venues.json: a venue is resolved by origin, so a
      # different hostname is a different venue and is refused.
      - signaldesk.agentpey.com
      # T102 — must match the `baseUrl` of the `vitrinee` row in venues.json,
      # for the same reason as SignalDesk's above.
      - vitrinee.agentpey.com
    envVars:
      # pnpm@11.24.0 (pinned via packageManager in package.json) requires
      # Node >=22.13 to run under Corepack — 22.11.0 makes Corepack crash
      # with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING instead of a clean
      # error, and plain `npm install -g pnpm` refuses to run at all
      # ("This version of pnpm requires at least Node.js v22.13").
      - key: NODE_VERSION
        value: 22.14.0
      # Corepack verifies the signature of the pnpm release it downloads
      # against a hardcoded key list. npm rotated its package-signing key
      # in 2025 and older Corepack builds predate the new key, so
      # verification can fail with "Cannot find matching keyid". This
      # disables that signature check (does not affect pnpm's own package
      # integrity hashes, which stay enforced). Kept as insurance even
      # though the Node-version bump above was the actual fix for the
      # last failure.
      - key: COREPACK_INTEGRITY_KEYS
        value: ""

      # ---- Shared ----------------------------------------------------------
      # The pilot's one Postgres, the only name all three apps are handed. Each
      # still reads only its own tables (`realops_*`, `signaldesk_*`, and
      # AgentPey's). Without it the MandateVault has nowhere durable to write
      # (T33: the old JSONL file lived on Render's ephemeral disk).
      - key: DATABASE_URL
        sync: false

      # ---- AgentPey (apps/web, agentpey.com) --------------------------------
      # Secrets — set these in the Render dashboard. Never committed, never
      # filled in here.
      - key: ISSUER_SECRET_KEY
        sync: false
      - key: AGENT_SECRET_KEY
        sync: false
      - key: AGENT_REGISTRY_CONTRACT_ID
        sync: false
      # T35 — signs `register_issuer` when a connected wallet anchors its
      # first Mandate (ensureWalletIsRegisteredIssuer). Missing here is exactly
      # why a wallet-signed session fails at "Iniciar sesión" with
      # "ADMIN_SECRET_KEY is missing".
      - key: ADMIN_SECRET_KEY
        sync: false
      # F4/T40 — the master seed each tenant's own derived Stellar identity
      # comes from (`@agentpey/tenancy`). Set once in the dashboard and never
      # regenerated (`.env.example`'s comment explains why).
      - key: MASTER_MNEMONIC
        sync: false
      - key: BAZAAR_BASE_URL
        value: https://stellar-bazaar-x402.vercel.app
      # Not a secret — a public Soroban contract address, already committed
      # in deployments/testnet.json and shown as `pagador` on the live demo
      # itself. Migrated once already (see AGENT_LOG.md, 2026-09-12): the
      # rail this pointed to since T31 predates T57's `principal`/`withdraw`/
      # `set_owner` — funds sent to it could never come back out. The old
      # contract (CCGAGRLVERK2A6PVQNU6YY62ANWNSFO32DM6OMFLRNLVHYJBLLON4G3I) is
      # abandoned with whatever symbolic testnet balance it held.
      - key: POLICY_RAIL_CONTRACT_ID
        value: CANSQJH7KPQTBUXPA42BBWZGZRKLWQZUFVF3SLQOUWKHEX4L3JP7YEDA
      # Not a secret either — the wasm hash of `contracts/policy-rail`'s
      # current source (T57), already uploaded to testnet.
      # `ensureTenantPolicyRail` (F6/T58) instantiates a new rail per
      # wallet-connected tenant from this same wasm, without re-uploading it.
      - key: POLICY_RAIL_WASM_HASH
        value: 8690d1f5ce18e6ef6209a400918d095450c01d7a8621ac795f404e11ea7e3175
      # T77 — the public address of the sponsoring reserve (the public key of
      # AGENT_SECRET_KEY above). Not a secret: it only ever has its balance
      # read, and keeping it separate from the secret is what stops a
      # read-only surface from needing a signing key.
      - key: RESERVE_ADDRESS
        value: GAK6E5E7L63ZYFZZZFXDTYVG6MVAKILSHI5FITGH5U4ORACEZQ4GFP2K
      # No PUBLIC_BASE_URL: apps/web infers its own origin from the request's
      # Host header, which the gateway forwards unchanged (proxy.ts).

      # ---- RealOps (apps/realops, realops.agentpey.com) ---------------------
      # T80 — the pilot's agent platform. It holds no Stellar key and cannot
      # authorise a payment; from T81 its only credential is an AgentPey /v1
      # API key.
      #
      # Also the origin AgentPey sends a person back to after signing, so it
      # must be registered as a return origin for RealOps' partner
      # (`pnpm run partner:return-origins`), or signing fails with
      # ReturnUrlNotAllowed and RealOps shows a 502.
      - key: REALOPS_PUBLIC_URL
        value: https://realops.agentpey.com
      # T81 — the partner key RealOps asks with. Mint it with
      # `pnpm run partner:create`.
      - key: REALOPS_AGENTPEY_API_KEY
        sync: false
      # RealOps calls AgentPey at its public address, not the internal port:
      # AgentPey builds consent links from the Host it is called with, and a
      # link to 127.0.0.1 would be no use to the person holding it.
      - key: AGENTPEY_BASE_URL
        value: https://agentpey.com
      # Links to the merchant on RealOps' pages.
      - key: SIGNALDESK_PUBLIC_URL
        value: https://signaldesk.agentpey.com
      - key: PILOT_VENUE_ID
        value: signaldesk:GB4D4PLLFEIKZK6MDW42MZRQ5XMPC6QRJN4FFRODO6D3PRB3MDGGYOOF
      - key: PILOT_ASSET_ID
        value: USDC:CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: PILOT_PAY_TO
        value: GB4D4PLLFEIKZK6MDW42MZRQ5XMPC6QRJN4FFRODO6D3PRB3MDGGYOOF
      # T100 — the real store connected through Vitrinee. Public values: the
      # store's payout account (the `address` of the `vitrinee` row in
      # venues.json, and the only `payTo` its 402 names) and where its
      # catalogue is read from. The origin must match that row's `baseUrl`.
      - key: VITRINEE_BASE_URL
        value: https://vitrinee.agentpey.com
      - key: VITRINEE_VENUE_ID
        value: vitrinee:GC5ZY7UJ7CKD7O7YURRSDIDVYEETYP2JXPKUL5E6GIWHUPAH5DCIVCII
      - key: VITRINEE_PAY_TO
        value: GC5ZY7UJ7CKD7O7YURRSDIDVYEETYP2JXPKUL5E6GIWHUPAH5DCIVCII
      # Without this, magic links are shown on screen and the address is NOT
      # verified — the page says so. Optional, like the sender below
      # (`RealOps <no-reply@agentpey.com>` when unset).
      - key: RESEND_API_KEY
        sync: false
      - key: REALOPS_MAIL_FROM
        sync: false

      # ---- SignalDesk (apps/signaldesk, signaldesk.agentpey.com) ------------
      # T79 — the pilot's merchant. Its own keys, handed to no other app.
      - key: SIGNALDESK_SECRET_KEY
        sync: false
      - key: SIGNALDESK_FACILITATOR_SECRET
        sync: false
      # SIGNALDESK_PUBLIC_URL is declared once, under RealOps above: one Render
      # service has one value per name, and both apps are handed it. SignalDesk
      # builds the delivery and receipt links it returns from it.

      # ---- Vitrinee (packages/vitrinee-gateway, vitrinee.agentpey.com) -------
      # T102 — the store gateway that turns the real Jumpseller shop into an
      # x402 merchant (`C-130`, `C-134`). Every name carries a `VITRINEE_`
      # prefix: Vitrinee reads generic names (`ADAPTER`, `PUBLIC_BASE_URL`,
      # `MERCHANT_SIGNING_SECRET`…), one service has one value per name, and
      # `apps/gateway/src/hosts.ts` (`envAliases`) hands these to Vitrinee's
      # process alone, renamed back. No other app is given any of them, and
      # Vitrinee is given none of AgentPey's (`C-136`).
      #
      # Until the four secrets below are set, the gateway does not start
      # Vitrinee and its host answers 503; the rest of the pilot is unaffected.
      #
      # The AgentPey service was created by hand and does not sync this file:
      # the public values below are documentation, and have to be entered in
      # the dashboard too. Found on the first deploy (T102). Vitrinee also
      # refuses to start without VITRINEE_ADAPTER, so it can never fall back
      # to its mock store in production.
      - key: VITRINEE_ADAPTER
        value: jumpseller
      # The child sits behind this gateway; absolute URLs in the manifest must
      # be the public ones.
      - key: VITRINEE_PUBLIC_BASE_URL
        value: https://vitrinee.agentpey.com
      - key: VITRINEE_MERCHANT_NAME
        value: Bazar Cordillera
      - key: VITRINEE_MERCHANT_COUNTRY
        value: CL
      - key: VITRINEE_MERCHANT_CURRENCY
        value: CLP
      - key: VITRINEE_FX_RATE_CLP_USD
        value: "950"
      - key: VITRINEE_SHIPPING_COUNTRIES
        value: CL
      # Public: where the USDC lands, and the `address` of the `vitrinee` row
      # in venues.json. The gateway never holds its secret (VT-8, VT-12).
      - key: VITRINEE_MERCHANT_STELLAR_ACCOUNT
        value: GC5ZY7UJ7CKD7O7YURRSDIDVYEETYP2JXPKUL5E6GIWHUPAH5DCIVCII
      - key: VITRINEE_FACILITATOR_URL
        value: https://channels.openzeppelin.com/x402/testnet
      # Public, also in deployments/vitrinee-testnet.json.
      - key: VITRINEE_RECEIPT_REGISTRY_ID
        value: CADILO6QYG3CT2PXEWIKOYLUACPXEP4P645L5HF6WVI2K7BSVN23ZTM5
      # Secrets — set these in the Render dashboard, from .env.vitrinee.local.
      # Signs receipts and pays anchor fees; cannot move the merchant's funds (VT-8).
      - key: VITRINEE_MERCHANT_SIGNING_SECRET
        sync: false
      - key: VITRINEE_FACILITATOR_API_KEY
        sync: false
      - key: VITRINEE_JUMPSELLER_LOGIN
        sync: false
      - key: VITRINEE_JUMPSELLER_AUTHTOKEN
        sync: false
