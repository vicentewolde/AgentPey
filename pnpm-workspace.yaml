# The pnpm workspace covers the TypeScript side only.
# `contracts/` is a separate Cargo workspace and deliberately contains no package.json.
packages:
  - "packages/*"
  - "apps/*"

# vitest pulls esbuild, whose postinstall resolves the prebuilt platform binary.
# Stellar Wallets Kit (T143) pulls four packages with install scripts, none needed for a browser bundle: reviewed and
# denied, so no third-party code runs at install time.
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  secp256k1: false
  utf-8-validate: false

# Stellar testnet moved to protocol 30 (2026-11): stellar-sdk 16.3.0 and 17.0–17.1 cannot read its ledger header, so
# every payment that sets an authorization's expiry (getLatestLedger) failed. Our own packages use 17.4.0; @x402/stellar
# still asks for ^16.3.0, so its copy is held at 16.4.1, the first 16.x that reads protocol 30.
overrides:
  '@x402/stellar>@stellar/stellar-sdk': 16.4.1
