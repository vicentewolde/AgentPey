# TypeScript side only. `contracts/` is a separate Cargo workspace with no package.json.
packages:
  - "packages/*"
  - "apps/*"

# vitest pulls esbuild, whose postinstall resolves the prebuilt platform binary.
allowBuilds:
  esbuild: true

# @x402/express lists @x402/paywall as a peer for its optional browser paywall; the
# gateway serves JSON only and never loads it.
peerDependencyRules:
  ignoreMissing:
    - "@x402/paywall"
